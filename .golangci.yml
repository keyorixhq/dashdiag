version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - prealloc
    - bodyclose
    - cyclop
    - funlen
  settings:
    funlen:
      lines: 90
      statements: 80
    cyclop:
      max-complexity: 30
    errcheck:
      exclude-functions:
        # Close errors on readers/connections are unrecoverable in-flight; callers already handled the data.
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net/http.Response.Body).Close
        # fmt writes to os.Stdout/os.Stderr never fail in practice in a CLI context.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Println
        - fmt.Printf
        - fmt.Print
    gosec:
      excludes:
        - G115  # integer conversion — Go generics noise
        - G104  # unhandled errors — redundant with errcheck linter
        - G204  # subprocess with variable — expected pattern in CLI/sysadmin tools
        - G304  # file inclusion via variable — expected in config/state reading
        - G301  # directory 0755 — acceptable for user-readable ~/.dsd/ dirs
        - G302  # OpenFile 0644 — shell RC files (.bashrc, .zshrc) must be world-readable
        - G306  # file 0644 — acceptable for config files and test fixtures; secrets use 0600
    revive:
      rules:
        - name: error-return
        - name: var-naming
        - name: indent-error-flow
        - name: superfluous-else
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters: [gosec, errcheck, funlen, cyclop]
      # SA5011 ("possible nil pointer dereference") is excluded by message text
      # rather than disabled via staticcheck's own checks list: setting
      # settings.staticcheck.checks at all switches its default scope from
      # "SA* only" to whatever list you give it, so "all, -SA5011" ends up
      # ALSO enabling the ST/S1/QF categories (50 new ST1000 "missing package
      # comment" findings appeared repo-wide) — this text-match form leaves the
      # enabled-checks scope untouched. Disabled because its cross-package fact
      # propagation is non-deterministic under golangci-lint's parallel
      # analysis — confirmed 2026-07-08 by two CI reruns of the same unchanged
      # commit flagging two entirely different sets of _test.go files. A flaky
      # check that can fail an unrelated PR on any run is worse than no check.
      - linters: [staticcheck]
        text: "SA5011"

issues:
  max-same-issues: 0
