# SonarCloud project configuration — rule-level suppressions only.
# Project key and org are set in .github/workflows/sonarcloud.yml.
# This file handles rule exclusions that do not fit inline NOSONAR comments.

# godre:S8205 — "Extract this nested anonymous struct into a named type"
# All flagged instances are one-shot JSON/XML deserialization shapes (k8s, docker,
# pacemaker). Inline anonymous structs are idiomatic Go for this pattern; naming
# them would scatter unrelated type definitions across the package with no benefit.
sonar.issue.ignore.multicriteria=s8205,s1313,s3776,s1186,s7688,s8193,s1479,s8545,sshell1192,ss6506
sonar.issue.ignore.multicriteria.s8205.ruleKey=godre:S8205
sonar.issue.ignore.multicriteria.s8205.resourceKey=**/*.go

# go:S1313 — "Make sure using this hardcoded IP address is safe here."
# All flagged addresses are cloud-provider-specified protocol constants: IMDS
# link-local endpoint (169.254.169.254 — mandated by AWS/Azure/GCP/OCI spec),
# Azure wire server (168.63.129.16), and well-known public DNS resolvers
# (8.8.8.8, 1.1.1.1, 9.9.9.9 etc., used for network-privacy detection).
# These cannot be user-configured — hardcoding them is the only correct
# implementation for a read-only diagnostics tool.
sonar.issue.ignore.multicriteria.s1313.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.s1313.resourceKey=**/*.go

# go:S3776 — "Refactor this function to reduce its Cognitive Complexity from N to 15"
# DashDiag is a diagnostic tool whose collectors, analysers, and renderers parse
# /proc files, system logs, cloud metadata APIs, and package manager outputs.
# The parsing and branch logic in these domains IS the business logic — it cannot
# be mechanically decomposed without making the code harder to follow. The project
# already runs golangci-lint cyclop with a deliberate threshold of 30, reflecting
# the accepted complexity for this domain. Sonar's default CC threshold of 15
# flags 210 production functions and ~105 test functions (315 total) — effectively
# the entire non-trivial codebase. Suppressing here avoids 315 inline NOSONAR
# annotations that would add no maintainability value.
sonar.issue.ignore.multicriteria.s3776.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.s3776.resourceKey=**/*.go

# go:S1186 — "Add a nested comment explaining why this function is empty"
# All 14 flagged empty bodies are intentional no-ops: build-tag platform stubs
# (disk_darwin_stub.go, security_notlinux.go, rh_api_other.go etc.) whose empty
# body IS the implementation, and cobra hook literals (PersistentPreRun) that
# explicitly suppress the brand header. All already have block comments (/* ... */)
# explaining the intent; Sonar requires a // line comment, not a /* */ block comment.
sonar.issue.ignore.multicriteria.s1186.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.s1186.resourceKey=**/*.go

# shelldre:S7688 — "Use '[[' instead of '[' for conditional tests"
# All 79 flagged sites are in #!/usr/bin/env bash scripts (not #!/bin/sh), so '[[' is
# technically valid. However, the majority of the az-validation and build scripts are
# POSIX-compatible by intent (run inside CI images with minimal bash versions) and
# some are pasted into Cloud Shell which may restrict bash version. The change to '[['
# is purely stylistic for these already-quoted-variable scripts and carries breakage risk.
sonar.issue.ignore.multicriteria.s7688.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.s7688.resourceKey=**/*.sh

# godre:S8193 — "Remove this unnecessary variable declaration and use the expression directly"
# All 35 flagged instances are in *_test.go files. Go tests often assign errors to
# named variables before checking (e.g. `err := f(); require.NoError(t, err)`) so the
# variable is reused or the inline-if form is less readable with testify assertions.
sonar.issue.ignore.multicriteria.s8193.ruleKey=godre:S8193
sonar.issue.ignore.multicriteria.s8193.resourceKey=**/*_test.go

# go:S1479 — "Reduce the number of switch branches from N to at most 30"
# The two flagged switches are the central analysis dispatch table (heuristics.go —
# 186 branches, one per check type) and the health renderer (health.go — 48 branches,
# one per check name). These are table-driven dispatchers whose branch count equals
# the feature count; splitting them would obscure the mapping without reducing
# complexity. The project's golangci-lint cyclop threshold of 30 covers cyclomatic
# complexity; Sonar's switch-branch count is an independent metric, not a duplicate.
sonar.issue.ignore.multicriteria.s1479.ruleKey=go:S1479
sonar.issue.ignore.multicriteria.s1479.resourceKey=**/*.go

# githubactions:S8545 — "Dependency versions are not predictable. Use a lock-file
# enforcing command instead."
# All flagged steps use `go install x@vX.Y.Z` with an exact pinned version tag.
# Go's module proxy + checksum database (sum.golang.org) provides content-addressable
# downloads for exact version tags — the semantic guarantee is equivalent to a lock
# file for Go tools. Requiring a separate go.sum lock file for one-off CI tool
# installs (govulncheck, gitleaks, syft, nfpm) would add significant overhead with
# no additional integrity benefit, since the sum DB already pins the exact content.
sonar.issue.ignore.multicriteria.s8545.ruleKey=githubactions:S8545
sonar.issue.ignore.multicriteria.s8545.resourceKey=**/*.yml

# shelldre:S1192 — "Define a constant instead of using this literal N times"
# Shell scripts lack named constants; the idiomatic alternative (assigning to a
# variable and referencing it) does not improve readability for short subcommand
# tokens like 'health --deep' or sed patterns, and would require restructuring
# entire function call sites for marginal benefit.
sonar.issue.ignore.multicriteria.sshell1192.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.sshell1192.resourceKey=**/*.sh

# shelldre:S6506 — "Not disabling redirects might allow for redirections to insecure websites"
# All 5 flagged wget calls are in install.sh and download from hardcoded GitHub API /
# releases URLs. GitHub releases use HTTP 302 redirects as part of their CDN delivery
# chain — adding --max-redirect=0 would break every download. The risk of an open
# redirect to an insecure site is already mitigated by --https-only (added on every
# call), which ensures any redirect target must stay on HTTPS. The URLs are not
# user-controlled (hardcoded to api.github.com / github.com/releases).
sonar.issue.ignore.multicriteria.ss6506.ruleKey=shelldre:S6506
sonar.issue.ignore.multicriteria.ss6506.resourceKey=install.sh

# CPD exclusions — files intentionally containing structural repetition.
# internal/cis/rules.go is a flat rule-registry (CIS Benchmark checks 3.1.1,
# 3.2.1, 3.2.2, 3.2.4): four checkSysctl invocations that are structurally
# identical by design — each maps a sysctl path to a recommended value.
# Abstracting further would obscure the per-rule identity; the repetition is
# the correct implementation for a registry file (same reasoning as the S3776
# suppression above for heuristics.go). Exclusion is project-level to avoid
# NOSONAR annotations that would be even more noise inside the registry.
sonar.cpd.exclusions=internal/cis/rules.go,\
  internal/explain/topics.go,\
  internal/collectors/thermal_other.go,\
  internal/collectors/timeline_hints.go
