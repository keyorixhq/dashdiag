# fixtures/docker-host-meltdown.yaml
# Demo: a Docker host where several things are quietly on fire — a crash-looping
# container, OOM kills, and a security footgun (container mounting the docker
# socket). dsd correlates them onto one screen.
# Origin: synthetic — authored fixture illustrating a realistic Docker host
# failure pattern, not captured from a real host.
# Use: dsd mock fixtures/docker-host-meltdown.yaml  |  dsd demo docker-host-meltdown
host: "docker-prod-01"
os: "Ubuntu 24.04 LTS"
version: "v0.6.10"
rows:
  - name: "CPU Load"
    inline: "61% (load avg 9.8 across 8 CPUs)"
  - name: "Memory"
    level: WARN
    message: "memory at 92% — OOM kill risk"
    hints: ["to inspect: docker stats --no-stream"]
  - name: "Disk"
    inline: "/ 73%"
  - name: "Docker"
    level: CRIT
    message: "container \"payments-api\" is crash looping (restarted >5 times); 3 container OOM kill(s) in the last hour"
    hints:
      - "to inspect: docker logs payments-api --tail 50"
      - "to fix: set memory limits in container config"
  - name: "Network"
    inline: "eth0 1Gbps  gw <1 ms"
  - name: "Systemd"
    inline: "boot 16s"
  - name: "Hardening"
    level: WARN
    message: "container \"ci-runner\" mounts /var/run/docker.sock — full host root from inside the container"
    hints: ["note: a compromised container with the socket = host takeover"]
  - name: "Firewall"
    inline: "nftables  12 rules"
narrative:
  - "payments-api has restarted more than 5 times and taken 3 OOM kills in the last hour — it's crash-looping, not just slow."
  - "Host memory is at 92%, so the kernel's OOM killer is actively picking victims under pressure."
  - "Separately, ci-runner mounts the Docker socket — a compromised container there is a host takeover, not a container-boundary problem."
  - "Set a memory limit on payments-api, check its logs, and drop the socket mount from ci-runner."
