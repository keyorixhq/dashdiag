name: SonarCloud

# Runs on every PR and push to main (new-code gate), plus a weekly schedule so
# a newly published rule or a regression on unchanged code is caught without
# waiting for the next PR. Complements CodeQL (SARIF/Security tab) with
# deeper maintainability, duplication, and Go-specific reliability checks.

on:
  push:
    branches: [main]
  # paths-ignore is applied ONLY to pull_request, deliberately. The `changes`
  # job it replaces emitted docs_only=false for every non-PR event, so push
  # and schedule ran the analysis unconditionally; putting paths-ignore on
  # push too would silently change that. This is a job-count change, not a
  # coverage change.
  #
  # Safe here and NOT safe in ci.yml or security.yml: a workflow that
  # paths-ignore skips never creates its check-runs at all, and branch
  # protection waits forever on a REQUIRED check that was never created.
  # Nothing this workflow produces is required (verified against branch
  # protection: 18 required contexts, none of them from here), so skipping
  # the whole workflow is equivalent to skipping its jobs. ci.yml and
  # security.yml both carry required checks and keep their `changes` jobs
  # for exactly that reason.
  pull_request:
    branches: [main]
    paths-ignore:
      # Exactly the allowlist the deleted `changes` job matched on. paths-ignore
      # means "run unless EVERY changed file matches", which is the same
      # predicate docs_only computed, one layer earlier and without a job.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'COMPATIBILITY.md'
      - 'GETTING_STARTED.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'BACKLOG.md'
      - 'BUGS.md'
      - 'LICENSE'
      - 'DCO'
      - 'docs/**'
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC — same cadence as security.yml

# Top-level is the floor (OSSF Scorecard Token-Permissions requires it
# explicitly); each job also carries its own block as defense-in-depth.
permissions:
  contents: read

# Cancel superseded runs on the same ref (matches ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-aware skip gate — same mechanism and allowlist as ci.yml's `changes`
  # job (keep the allowlist in sync there; not a required branch-protection
  # check today, but gated for consistency and runner-time savings). Only
  # gates pull_request events; push/schedule always run the full analysis.
  sonarcloud:
    # Dependabot-triggered pull_request runs don't get repository Actions
    # secrets (GitHub withholds them unless SONAR_TOKEN is separately
    # registered as a Dependabot secret) — the scan would just fail on
    # "Not authorized". Skip here; push-to-main still runs the full scan
    # once the bump is merged.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # SonarCloud PR decoration (inline annotations on diffs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history required for blame/new-code detection

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26', cache: true}

      - name: Generate coverage report
        # coverage.out is passed to SonarCloud so it can populate the Coverage
        # dimension (otherwise it stays blank, as in a manual scan without CI).
        run: go test -coverprofile=coverage.out -covermode=set ./...

      # sonarcloud-github-action is deprecated and archived (2025-10-22, read-only);
      # its own README calls sonarqube-scan-action "a drop-in replacement." Migrated
      # 2026-08-06 — same SONAR_TOKEN/args contract, no config change needed.
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=keyorixhq_dashdiag
            -Dsonar.organization=keyorixhq
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.exclusions=testdata/**,**/testdata/**,vendor/**,fixtures/**,packaging/appimage/**,**/*.png,**/*.tar.gz
            -Dsonar.test.inclusions=**/*_test.go
