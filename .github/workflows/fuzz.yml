name: Fuzz

on:
  schedule:
    - cron: '0 2 * * 1'  # Monday 02:00 UTC — weekly corpus mutation run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-portable:
    name: Fuzz portable targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Run portable fuzz targets
        run: make test-fuzz FUZZTIME=5m
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-portable-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  fuzz-linux:
    name: Fuzz Linux-only targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Run Linux-only fuzz targets
        run: make test-fuzz-linux FUZZTIME=5m
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-linux-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
