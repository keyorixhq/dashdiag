name: Security

# SSDLC Layer 1 (ADR-0007). gosec runs on every PR via the CI lint job
# (golangci-lint with .golangci.yml excludes — single source of truth, no
# config drift). govulncheck and gitleaks both run here on every PR (gate
# before merge) and on the weekly SCHEDULE against unchanged code on main —
# the schedule is what catches a newly published CVE, or a secret nobody
# noticed, the moment the vuln DB / history changes meaning, with no code
# change of our own needed to trigger a run.
#
# History note: this job previously ran standalone `gosec ./...` with the
# DEFAULT ruleset, ignoring the .golangci.yml excludes — it was permanently
# red with ~37 pre-triaged findings (G104/G204/G304...). Removed 2026-06-12;
# gosec coverage moved to the PR gate where the tuned config applies.

on:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# govulncheck/gitleaks only read the tree; no SARIF upload, no repo writes.
permissions:
  contents: read

jobs:
  # Diff-aware skip gate — same mechanism and allowlist as ci.yml's `changes`
  # job (kept in sync there; see that file for the full rationale on why this
  # is an allowlist gated via job-level `if:`, never `paths-ignore`). Only
  # `security` (govulncheck) and `gitleaks` are required branch-protection
  # checks in this file — verified via `gh api repos/keyorixhq/dashdiag/
  # branches/main/protection -q '.required_status_checks.contexts'`
  # (2026-08-06) — but every job here is gated for consistency and to save
  # runner time regardless. Only gates pull_request events; schedule/push
  # always run the full suite.
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # to list the PR's changed files
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^(README\.md|CONTRIBUTING\.md|CHANGELOG\.md|COMPATIBILITY\.md|GETTING_STARTED\.md|PRIVACY\.md|SECURITY\.md|BACKLOG\.md|BUGS\.md|LICENSE|DCO|docs/)' > /dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  security:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # TEMPORARY pin to 1.26.5 (normally floats '1.26' — see ci.yml's top note).
      # GO-2026-5856 is a crypto/tls Encrypted-Client-Hello leak fixed in go1.26.5,
      # but GitHub's setup-go version manifest still serves 1.26.4, so a floating
      # '1.26' fails govulncheck here. Revert to '1.26' once the manifest lists
      # 1.26.5 (then the float catches this and future stdlib CVE fixes on its own).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26.5', cache: true}

      - name: govulncheck
        # Pinned, not @latest (OSSF Scorecard Pinned-Dependencies) — a compromised
        # newest release would otherwise run unreviewed in CI. Bump deliberately.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
        # GitHub will email you when this step fails in a scheduled run

  # CI-level backstop for the pre-commit gitleaks hook (scripts/hooks/pre-commit):
  # that hook only catches a NEW secret, only if the contributor installed it
  # locally. This job scans the FULL commit history on every run, so it also
  # catches (a) a secret from a contributor/fork PR that skipped the hook, and
  # (b) anything that slipped in before the hook existed. Installed via `go
  # install` (gitleaks is a Go binary) rather than the gitleaks-action
  # marketplace Action, matching govulncheck's own pattern — one less
  # third-party Action, and we already know exactly what command runs.
  gitleaks:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0} # full history — gitleaks detect needs every commit, not just HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26', cache: true}

      - name: gitleaks
        # Pinned, not @latest — same Scorecard rationale as govulncheck above.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks detect --no-banner

  # Complements govulncheck: govulncheck only reports vulns reachable through
  # the actual call graph; OSV Scanner covers the full go.sum transitive graph
  # and the broader OSV ecosystem database — catching a dependency that is
  # vulnerable even if DashDiag doesn't call the affected symbol. Same
  # schedule and trigger as govulncheck so a newly published CVE fires both.
  osv-scanner:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26', cache: true}

      - name: osv-scanner
        # Pinned, not @latest — same Scorecard rationale as govulncheck above.
        # v2 module path (github.com/google/osv-scanner/v2); bumped from v1 which
        # reached end-of-active-development after v1.9.2. Bump deliberately.
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
          osv-scanner scan .

  # Blocks a PR that INTRODUCES a new vulnerable/license-flagged dependency —
  # distinct from govulncheck (only scans what's already merged and imported)
  # and from Dependabot (schedule-based, proposes an update, doesn't gate a
  # PR). No Go-binary equivalent exists (needs GitHub's PR base/head dependency
  # graph diff), so this is a marketplace Action, not `go install` — the one
  # exception to that pattern in this file, for lack of an alternative.
  # PR-only: there's no head/base pair to diff outside a pull_request event.
  dependency-review:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # Matches the project's own CVSS-threshold philosophy elsewhere
          # (health --cve WARNs at >=7.0): don't hard-fail a PR on low/moderate
          # noise, reserve the gate for genuinely serious new dependencies.
          fail-on-severity: high

  # GitHub Actions workflow misconfig scanning.  DashDiag is a CLI binary so
  # Trivy's container-image and OS-package scanning don't apply here — those
  # surfaces are covered by govulncheck and osv-scanner on the Go module graph.
  # What Trivy adds is the misconfig ruleset for workflow files: expression
  # injection via ${{ github.event.*.body }} in run: steps, pull_request_target
  # with untrusted code checkout, and similar CI supply-chain risks that neither
  # Scorecard (which only checks pinned deps and token permissions) nor our
  # custom Semgrep rules cover.  Scoped to .github/ so it scans nothing else.
  trivy-misconfig:
    name: Trivy (GH Actions misconfigs)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Known failure mode, seen in a sibling repo: `format: sarif` +
      # `exit-code: '1'` in ONE step is riskier than it looks. Trivy logs an
      # unrelated scan-target error (e.g. a chart/template that can't render
      # without external values) as a mere warning under the default table
      # formatter, but the SARIF formatter can route that same internal error
      # through a different code path into a hard non-zero exit with NO
      # findings printed — opaque, and easy to mistake for "scan itself is
      # broken." Not hit here (this scan targets .github/ directly, not a
      # templated surface), but if this job ever goes red with no visible
      # findings, split back into a non-blocking SARIF-upload step and a
      # separate blocking table-format step before assuming the scanner is
      # broken — don't just merge/iterate against a red build blind.
      - name: Scan workflow files for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .github/
          scanners: misconfig
          format: sarif
          output: trivy-misconfig.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload results to Security tab
        if: always()  # upload even when the scan finds issues (exit-code 1)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-misconfig.sarif
