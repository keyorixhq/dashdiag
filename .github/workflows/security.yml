name: Security

# SSDLC Layer 1 (ADR-0007). gosec runs on every PR via the CI lint job
# (golangci-lint with .golangci.yml excludes — single source of truth, no
# config drift). govulncheck runs here on every PR (gates before merge) and
# on the weekly SCHEDULE against unchanged code on main — the schedule is
# what catches a newly published CVE in our dependency tree the moment the
# vuln DB learns about it, with no code change to trigger a PR run.
#
# History note: this job previously ran standalone `gosec ./...` with the
# DEFAULT ruleset, ignoring the .golangci.yml excludes — it was permanently
# red with ~37 pre-triaged findings (G104/G204/G304...). Removed 2026-06-12;
# gosec coverage moved to the PR gate where the tuned config applies.

on:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# govulncheck only reads the tree; no SARIF upload, no repo writes.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: 'go.mod', cache: true}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        # GitHub will email you when this step fails in a scheduled run
