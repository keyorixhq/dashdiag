name: Scorecard supply-chain security

# OpenSSF Scorecard (SSDLC Layer 2, ADR-0007): scores this repo against the
# supply-chain best practices enterprise reviewers ask about — pinned
# dependencies, token permissions, branch protection, signed releases, dangerous
# workflow patterns. Results land in the repo's Security tab (code scanning) and,
# via publish_results, on the public OpenSSF dashboard so the README badge works.
# It complements release signing (PR #205): signing proves authenticity, Scorecard
# documents the practices around it.

on:
  branch_protection_rule:
  schedule:
    - cron: '27 9 * * 1' # weekly, offset from the Security job
  push:
    branches: [main]

# Read-only by default; the analysis job below elevates only what it needs.
permissions:
  contents: read

# Cancel superseded runs on the same ref (matches ci.yml's own convention):
# a later push to main makes an in-flight run's result moot before it even
# finishes.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write        # OIDC, to publish results to the public OpenSSF API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to api.securityscorecards.dev (public, derived from already-
          # public repo signals) so the README badge resolves. Set to false to keep
          # results only in the Security tab.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
