name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repo (tests, lint, smoke,
# shellcheck) — none write contents, comment, or upload. Scoped at the top so a
# new job can't silently inherit a broad default token.
permissions:
  contents: read

# Every setup-go step below uses `go-version: '1.26'` (floating minor), NOT
# go-version-file: go.mod (exact patch). A go.mod-pinned patch silently goes
# stale the moment Go ships a stdlib CVE fix in a newer patch — this bit us
# 2026-07-04: go.mod said 1.26.3, Go 1.26.4 already carried two fixed CVEs
# (GO-2026-5037, GO-2026-5039), and CI kept building the vulnerable one until
# the govulncheck PR-gate got re-enabled and caught it. go.mod's `go` line is a
# minimum-language-version floor, not an exact pin, so a newer installed patch
# is always compatible — floating here means CI auto-tracks security fixes
# without anyone remembering to bump go.mod.

jobs:
  # Every commit on a PR must carry a Signed-off-by trailer (DCO v1.1).
  # Co-founders and external contributors: use `git commit --signoff` (or -s).
  # To fix a branch: `git rebase --signoff origin/main`.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Check every PR commit carries Signed-off-by
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          FAIL=0
          for sha in $(git log --no-merges --format="%H" "origin/${BASE}..HEAD"); do
            if ! git show -s --format="%B" "$sha" | grep -q "^Signed-off-by:"; then
              echo "::error::$sha missing Signed-off-by — fix: git rebase --signoff origin/${BASE}"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ All PR commits carry Signed-off-by"
          exit $FAIL

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -timeout 180s ./...

      - name: Coverage floor (≥96%)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          INT=${TOTAL%.*}
          if [ "$INT" -lt 96 ]; then
            echo "::error::Coverage ${TOTAL}% is below the 96% floor — add tests or adjust the gate in ci.yml"
            exit 1
          fi
          echo "Coverage: ${TOTAL}% ✓"

      - name: Build all platforms
        if: matrix.os == 'ubuntu-24.04'
        run: |
          GOOS=linux  GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dsd
          GOOS=linux  GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dsd
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dsd
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dsd

  # Replay hermeticity guard: capture once, replay the SAME bundle twice, and assert
  # the rendered JSON is byte-identical (modulo volatile timestamp/duration). Two
  # replays of one bundle MUST match — a difference means a collector reads live
  # state under replay (the bug class closed by the capture/replay epic, #339–#355).
  # Also fails on a recording gap. Run as a workflow step (not a Go test) so the
  # binary runs once per process — no in-process source-swapping under -race.
  replay-hermetic:
    name: Replay hermeticity (double-replay diff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - name: Build dsd
        run: go build -o /tmp/dsd ./cmd/dsd
      - name: Capture once, replay twice, assert byte-stable
        run: |
          set -euo pipefail
          /tmp/dsd capture --raw -o /tmp/b.tar.gz
          if /tmp/dsd replay /tmp/b.tar.gz 2>&1 >/dev/null | grep -qi "not present in replay"; then
            echo "::error::replay hit a recording gap — a collector read an uncaptured input"
            exit 1
          fi
          /tmp/dsd replay --json /tmp/b.tar.gz > /tmp/r1.json
          /tmp/dsd replay --json /tmp/b.tar.gz > /tmp/r2.json
          NORM='. | del(.timestamp) | .checks |= map(del(.duration))'
          jq -S "$NORM" /tmp/r1.json > /tmp/n1.json
          jq -S "$NORM" /tmp/r2.json > /tmp/n2.json
          if ! diff -u /tmp/n1.json /tmp/n2.json; then
            echo "::error::two replays of the same bundle differ — a collector reads live state under replay (hermeticity regression)"
            exit 1
          fi
          echo "✅ replay is hermetic: two replays byte-identical (modulo timestamp/duration)"
      - name: Deep variant — capture --deep, replay --deep, assert byte-stable
        run: |
          set -euo pipefail
          # The --deep path records the deep collectors (per-core CPU, smaps, cgroup
          # slices, package integrity, FD scan). Guard it too — this caught FDLimits'
          # ctx-budget-bounded /proc scan returning a different subset per replay on a
          # busy runner (fixed by recording the derived scan via Source.Cached).
          # Replay THREE times vs a reference: the timing-dependent class only shows
          # under load, so more samples = a tighter guard.
          /tmp/dsd capture --raw --deep --pkg -o /tmp/bd.tar.gz
          if /tmp/dsd replay --deep /tmp/bd.tar.gz 2>&1 >/dev/null | grep -qi "not present in replay"; then
            echo "::error::deep replay hit a recording gap — a deep collector read an uncaptured input"
            exit 1
          fi
          NORM='. | del(.timestamp) | .checks |= map(del(.duration))'
          /tmp/dsd replay --deep --json /tmp/bd.tar.gz > /tmp/rdref.json
          jq -S "$NORM" /tmp/rdref.json > /tmp/ndref.json
          for i in 1 2 3; do
            /tmp/dsd replay --deep --json /tmp/bd.tar.gz > /tmp/rdx.json
            jq -S "$NORM" /tmp/rdx.json > /tmp/ndx.json
            if ! diff -u /tmp/ndref.json /tmp/ndx.json; then
              echo "::error::deep replay $i differs from reference — a deep collector reads live state under replay (hermeticity regression)"
              exit 1
            fi
          done
          echo "✅ deep replay is hermetic: 3 --deep replays byte-identical (modulo timestamp/duration)"

  # Cross-environment replay FIDELITY guard (complements replay-hermetic above).
  # The double-replay job proves two replays in the SAME environment agree; it is
  # blind to a collector that reads live ENVIRONMENT state at replay time
  # (container-context, adjtimex/clock-sync, kernel, arch) because capture-env ==
  # replay-env hides the divergence. That gap shipped a real bug: a captured "NTP
  # not synchronized" CRIT replayed as a green "host: synced" OK inside a container
  # (#586). This job replays a committed bundle captured on a DISTINCTIVE host
  # (verdicts differ from any runner) inside a container and asserts every check's
  # status matches the checked-in golden — drift means a collector reads live state
  # under replay. See fixtures/replay-fidelity/README.md.
  replay-fidelity:
    name: Replay fidelity (cross-env golden)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - name: Replay distinctive fixtures in a container, assert golden verdicts
        run: ./scripts/check-replay-fidelity.sh

  # SSDLC Layer 1 (ADR-0007): the .golangci.yml gosec config previously only ran
  # locally / pre-push — nothing gated PRs. This is the PR security gate.
  lint:
    name: Lint + gosec (golangci-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2  # keep in sync with local dev (brew)

  # SSDLC Layer 1 (ADR-0007): custom semgrep rules for our recurring risk
  # patterns (root-privileged exec + parsing). Rules live in .semgrep/.
  # p/go adds the Semgrep community Go ruleset (format-string injection,
  # integer overflow, improper error handling) that the custom rules don't cover.
  # Rule-per-finding discipline: every confirmed security finding ends with
  # the rule that catches its class.
  semgrep:
    name: Semgrep (custom + p/golang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: pipx install semgrep
      - run: semgrep scan --config .semgrep/ --config p/golang --error --severity ERROR --severity WARNING .

  # Fail the build on any dependency whose license is not in the enterprise-safe
  # allowlist (MIT/Apache-2.0/BSD/ISC/MPL-2.0). Catches a new transitive dep
  # before it lands in a customer audit — faster to fix than after the fact.
  license-gate:
    name: License allowlist (go-licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: true
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check dependency licenses
        run: go-licenses check ./... --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  # Guards the install front door — a P0 (broken one-liner for every new user,
  # #123) slipped through because install.sh had ZERO automated coverage. This
  # runs THIS branch's install.sh in a clean container against the latest
  # release and asserts dsd actually installs + runs, on both arches.
  install-smoke:
    name: Install one-liner (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # arm64 needs emulation on an amd64 runner.
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Install via install.sh in a clean container (curl, default prefix)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e GITHUB_TOKEN \
            -v "$PWD/install.sh:/tmp/install.sh:ro" debian:13 sh -c '
              set -e
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates >/dev/null
              sh /tmp/install.sh
              dsd --version
            '

      # The wget branch (fetch_latest_version/download/verify_checksum all fork on
      # curl-vs-wget) was never exercised — a bug there ships silently to curl-less
      # minimal images. Arch-independent script logic, so amd64-only to skip slow
      # emulated arm64.
      - name: Install via wget-only path (no curl on the box)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/install.sh:/tmp/install.sh:ro" debian:13 sh -c '
              set -e
              apt-get update -qq >/dev/null
              apt-get install -y -qq wget ca-certificates >/dev/null
              sh /tmp/install.sh
              dsd --version
            '

      # Fail-CLOSED guard (threat model CLI F-3): if integrity can't be verified the
      # installer must ABORT, not silently install an unverified binary. Simulate a
      # box with no hashing tool (remove sha256sum; shasum isn't present on debian),
      # then assert: default => non-zero exit AND nothing installed; --no-verify =>
      # installs. Without this guard the old silent skip-and-continue could regress.
      - name: Install fails closed when it cannot verify (and --no-verify overrides)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/install.sh:/tmp/install.sh:ro" debian:13 sh -c '
              set -e
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates >/dev/null
              rm -f /usr/bin/sha256sum /usr/bin/shasum   # leave the box with no way to hash
              if sh /tmp/install.sh; then echo "FAIL: installed without verification"; exit 1; fi
              if command -v dsd >/dev/null 2>&1; then echo "FAIL: dsd present after a refused install"; exit 1; fi
              echo "OK: refused unverified install"
              sh /tmp/install.sh --no-verify
              dsd --version
            '

      # The documented `--prefix DIR` flag (install.sh header line 4) was broken —
      # main() read the prefix positionally, so `--prefix` landed in ./--prefix/bin.
      # Guard the documented form so it can't silently regress again.
      - name: Install with documented --prefix flag (custom root)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/install.sh:/tmp/install.sh:ro" debian:13 sh -c '
              set -e
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates >/dev/null
              sh /tmp/install.sh --prefix /opt/dsd
              test -x /opt/dsd/bin/dsd
              /opt/dsd/bin/dsd --version
            '

  # Static lint of the install front door — cheap guard against the shell-scripting
  # bug class that produced the #123 P0 (a stdout/stderr mix-up that aborted every
  # install). shellcheck is preinstalled on GitHub ubuntu runners.
  shellcheck:
    name: Shellcheck install.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: shellcheck install.sh scripts/check-nonroot-invariant.sh scripts/alpine-smoke.sh scripts/check-replay-fidelity.sh scripts/container-honesty-smoke.sh scripts/fuzz-continuous.sh scripts/fuzz-smoke-ci.sh

  # Non-root invariant guard for the recurring "non-root false verdict" bug class
  # (BUG-064/066/067/070). A privileged tool (btrfs/nvme/nft/sshd -T/…) emits
  # different output unprivileged; a buggy collector reads that as a false CRIT/WARN.
  # Run dsd as root AND non-root on the same healthy box (with a real loopback btrfs
  # mounted) and fail if any check raises a WARN/CRIT non-root that root doesn't —
  # the whole point being that CI otherwise runs everything as root, so this branch
  # was never exercised. NOTE: the deterministic BUG-070 guard is the btrfs unit
  # test (the `MISSING` artifact is btrfs-progs-version-specific and may not
  # reproduce here); this job guards the broader class on every push.
  nonroot-invariant:
    name: Non-root verdict invariant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - name: Build dsd
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dsd" ./cmd/dsd
      - name: Assert non-root never escalates a verdict vs root
        run: DSD="$RUNNER_TEMP/dsd" ./scripts/check-nonroot-invariant.sh

  # Non-systemd / musl coverage. Every other job runs on ubuntu/debian/macOS
  # (systemd + glibc), so the musl + busybox + OpenRC surface is otherwise
  # untested in CI — yet dsd keeps hitting bugs there: DBus/journald phantom
  # warnings (BUG-051), systemctl hints on OpenRC (BUG-054), and the OOM
  # `dmesg --time-format` busybox-incompatibility (BUG-071, this session). Build a
  # static binary (CGO_ENABLED=0 → runs on musl) and assert `dsd health` runs
  # HONESTLY in a stock alpine container: no panic, valid JSON, and the non-root
  # run never escalates a verdict beyond root. Cheap (one container), closes a
  # recurring blind spot.
  alpine-musl-smoke:
    name: Alpine (musl/busybox) honesty smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - name: Build static dsd (musl-compatible)
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dsd" ./cmd/dsd
      - name: Run honesty smoke in alpine:latest
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/dsd:/usr/local/bin/dsd:ro" \
            -v "$PWD/scripts/alpine-smoke.sh:/alpine-smoke.sh:ro" \
            alpine:latest sh /alpine-smoke.sh

  # The container-context honesty guard. dsd reads cgroup-v2 counters from the
  # container's OWN cgroup dir; under --cgroupns=host the bare /sys/fs/cgroup is the
  # HOST ROOT, so a regression reading the base sees 0 throttled periods and a
  # throttled container false-reads healthy (#585). No other CI job exercises the
  # --cgroupns=host path. Saturates a fractional CPU quota and asserts dsd guest
  # DETECTS the throttling.
  container-cgroupns-smoke:
    name: Container honesty smoke (cgroupns=host throttle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26' # floating minor, not go.mod's exact patch — see note below
          cache: true
      - name: Build static dsd
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dsd" ./cmd/dsd
      - name: Run container-honesty smoke (--cgroupns=host, throttled)
        run: |
          docker run --rm --cgroupns=host --cpus=0.3 \
            -v "$RUNNER_TEMP/dsd:/usr/local/bin/dsd:ro" \
            -v "$PWD/scripts/container-honesty-smoke.sh:/smoke.sh:ro" \
            debian:13 sh /smoke.sh

  # Fuzz smoke — runs every PR to catch a broken fuzz target before it silently
  # disappears from the continuous rig's rotation. Not a corpus-building session:
  # each target runs for 30s against the existing seed/crash corpus only. The
  # permanent continuous rig on the Oracle Ampere A1 box handles real coverage
  # growth (scripts/fuzz-continuous.sh + docs/CONTINUOUS_FUZZING.md). Targets are
  # discovered dynamically (via scripts/fuzz-smoke-ci.sh) so the list can't go
  # stale the way the hardcoded `make test-fuzz` list did for months (#728 context).
  fuzz-smoke:
    name: Fuzz smoke (30s per target)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: true
      - name: Run fuzz smoke (30s per target)
        run: bash scripts/fuzz-smoke-ci.sh
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-smoke-crashes-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
