name: Release

on:
  push:
    tags: ['v*']

# Workflow-level default is read-only (least privilege); the release job below
# grants exactly what it needs (contents: write to publish the release + assets,
# id-token/attestations for build provenance) via its own job-level block, which
# REPLACES (not adds to) this default for that job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    # SIGN is 'true' only when the signing key secret exists, so the signing step
    # below stays inert until the maintainer adds it (secrets can't be read inside
    # a step-level `if`, so map it to a job env here). See docs/RELEASE_SIGNING.md.
    env:
      SIGN: ${{ secrets.MINISIGN_SECRET_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}

      # Floating minor, not go.mod's exact patch — see ci.yml's top-of-file note
      # (a go.mod-pinned patch silently goes stale on a stdlib CVE fix).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26', cache: true}

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build all platforms
        run: |
          VERSION=$(git describe --tags --always)
          COMMIT=$(git rev-parse --short HEAD)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=github.com/keyorixhq/dashdiag
          FLAGS="-X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.Commit=${COMMIT} -X ${MODULE}/internal/version.Built=${BUILT} -s -w"
          mkdir -p dist
          GOOS=linux  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$FLAGS" -trimpath -o dist/dsd-linux-amd64   ./cmd/dsd
          GOOS=linux  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$FLAGS" -trimpath -o dist/dsd-linux-arm64   ./cmd/dsd
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$FLAGS" -trimpath -o dist/dsd-darwin-amd64  ./cmd/dsd
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$FLAGS" -trimpath -o dist/dsd-darwin-arm64  ./cmd/dsd
          cd dist && sha256sum dsd-* > checksums.txt

      - name: Build .deb / .rpm packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          scripts/build-packages.sh "${GITHUB_REF_NAME#v}"

      - name: Build AppImages
        run: |
          # Reuses the linux binaries already in dist/; fetches appimagetool itself.
          # The AppImage is the SteamOS / immutable-rootfs install path (survives OS updates).
          scripts/build-appimage.sh "${GITHUB_REF_NAME#v}"
          cd dist && sha256sum dsd-*.AppImage >> checksums.txt

      # SBOM: what's actually IN a release, for enterprise pre-pilot security
      # review (the same audience minisign/attestation serve). One source-level
      # SBOM covers every platform binary — CGO_ENABLED=0 across the board means
      # identical go.mod/go.sum dependencies regardless of target OS/arch, so a
      # per-binary SBOM would just be four identical copies. `go install` (syft
      # is a Go binary) matches the project's own convention (govulncheck/
      # gitleaks/nfpm) over a marketplace Action.
      - name: Generate SBOM
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.46.0
          syft dir:. --source-name dashdiag --source-version "${GITHUB_REF_NAME#v}" -o spdx-json=dist/dsd.spdx.json
          cd dist && sha256sum dsd.spdx.json >> checksums.txt

      # Sign the FINAL checksums.txt with minisign — the authenticity anchor that
      # `dsd update` verifies in-binary (closes the self-updater single-origin gap).
      # Inert until the maintainer adds the MINISIGN_SECRET_KEY secret (SIGN env
      # above): a missing key SKIPS this step and never fails a release, exactly
      # like the Homebrew-tap job. checksums.txt.minisig ships via `files: dist/*`.
      - name: Sign checksums.txt (minisign)
        if: ${{ env.SIGN == 'true' }}
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # `minisign` isn't packaged for ubuntu-22.04 (not even in universe —
          # confirmed 2026-07-06 when a release failed on this exact step).
          # Fetch the upstream prebuilt binary directly instead, pinned to an
          # exact version + sha256, matching this repo's own convention of not
          # trusting OS package availability for a release-critical tool.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          # Pipe the password (empty line for a passwordless key) so signing is
          # non-interactive. -t records a trusted comment bound into the signature.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S \
            -s "$RUNNER_TEMP/minisign.key" \
            -m dist/checksums.txt \
            -t "dsd ${GITHUB_REF_NAME} checksums"
          rm -f "$RUNNER_TEMP/minisign.key"
          test -f dist/checksums.txt.minisig
          echo "Signed checksums.txt → checksums.txt.minisig"

      # Smoke-test EVERY artifact in a clean container before publishing — install
      # it the way a user would and confirm `dsd` runs. A broken artifact fails the
      # release here instead of reaching users (the install.sh P0, #123, shipped
      # because nothing tested the front door). amd64 only (release runner arch);
      # arm64 packages are built identically and the install.sh path is PR-guarded.
      - name: Smoke-test artifacts (before publishing)
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          run() { docker run --rm -v "$PWD/dist:/d:ro" "$1" sh -c "$2"; }
          echo "::group::raw linux-amd64 binary"
          run debian:13 'install -m755 /d/dsd-linux-amd64 /usr/local/bin/dsd && dsd --version'
          echo "::group::.deb (dpkg)"
          run debian:13 "dpkg -i /d/dsd_${VER}_amd64.deb && dsd --version"
          echo "::group::.rpm (rpm)"
          run rockylinux:9 "rpm -i /d/dsd-${VER}-1.x86_64.rpm && dsd --version"
          echo "::group::AppImage (extract-and-run, no FUSE in CI)"
          run debian:13 "install -m755 /d/dsd-${VER}-x86_64.AppImage /tmp/a && /tmp/a --appimage-extract-and-run --version"
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true

      # SLSA-style build provenance via GitHub's native OIDC/Sigstore attestation —
      # complements minisign (docs/RELEASE_SIGNING.md), doesn't replace it. Minisign
      # proves "signed by whoever holds the maintainer's private key" (only as
      # strong as how well that key is protected); this proves "built by this exact
      # CI run from this exact tagged commit," with no key to generate or protect.
      # Placed AFTER the release is published so a hiccup here can't block
      # distribution — a failure surfaces as a red job (fix before the next tag),
      # not a blocked release. Verify with:
      #   gh attestation verify <downloaded-file> --owner keyorixhq
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # Explicit patterns, not a bare 'dist/*': build-appimage.sh leaves a
          # dist/.appimagetool CACHE DIRECTORY behind, and it's not worth betting
          # on this action's glob library silently excluding dotfiles/dirs the
          # way a POSIX shell would — every pattern here has a non-dot
          # prefix/suffix so it can never match that directory.
          subject-path: |
            dist/dsd-linux-*
            dist/dsd-darwin-*
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/checksums.txt*
            dist/dsd.spdx.json

  # Multi-arch OCI image: ghcr.io/keyorixhq/dashdiag, tagged <semver>/<major.minor>/
  # latest. A separate job (not steps bolted onto `release` above) so a
  # registry/buildx hiccup can't block the binary/package release that already
  # succeeded — same "placed so a failure here can't block distribution"
  # principle release's own build-provenance step uses, extended to a whole job.
  # needs: [release] so this only runs once the binaries/packages/SBOM/checksums
  # have actually published successfully — the image's own SBOM below is
  # image-specific (BuildKit/syft over the final layers), not a copy of dist/dsd.spdx.json.
  image:
    name: Container image (ghcr.io)
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write    # push to ghcr.io — scoped to only this job
      id-token: write    # cosign keyless OIDC + attest-build-provenance's Sigstore cert
      attestations: write
      # actions/attest(-build-provenance) v4's own documented requirement for
      # attesting an OCI subject (push-to-registry: true) — see its README.
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tags + build metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=$VERSION"
            echo "minor=${VERSION%.*}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No docker/setup-qemu-action here: the Dockerfile's build stage pins
      # `--platform=$BUILDPLATFORM` so `go build` cross-compiles natively for
      # both target arches (no emulated execution), and the distroless final
      # stage has no RUN steps at all — this multi-arch build needs zero QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sbom: true attaches a BuildKit/syft-generated SPDX SBOM as a native OCI
      # attestation on the image itself (one per platform) — the container
      # analogue of dist/dsd.spdx.json above, which only covers the raw
      # binaries. provenance is intentionally NOT requested here (no
      # `provenance: true`) to avoid two differently-shaped provenance
      # attestations on the same subject — the attest-build-provenance step
      # below is this repo's one SLSA-provenance source of truth, verified the
      # same way (`gh attestation verify`) for both binaries and this image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILT=${{ steps.meta.outputs.built }}
          tags: |
            ghcr.io/keyorixhq/dashdiag:${{ steps.meta.outputs.version }}
            ghcr.io/keyorixhq/dashdiag:${{ steps.meta.outputs.minor }}
            ghcr.io/keyorixhq/dashdiag:latest

      # cosign keyless (OIDC, no key to generate/protect/rotate) signs the
      # image digest directly — the OCI-native authenticity anchor a
      # `cosign verify` policy (admission controllers, `docker scout`, etc.)
      # checks. This is genuinely additive next to minisign, not redundant
      # with it (docs/RELEASE_SIGNING.md's "cosign was never adopted" note is
      # about checksums.txt, which has no OCI-manifest equivalent for minisign
      # to sign) — the same keyless/no-key rationale that note already gives
      # for preferring attest-build-provenance's Sigstore cert over a
      # long-lived key for the binaries.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/dashdiag@${{ steps.build.outputs.digest }}"

      # SLSA-style build provenance, same mechanism/verification command as the
      # binaries above (`gh attestation verify ... --owner keyorixhq`), now for
      # the image subject by digest instead of a subject-path.
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/keyorixhq/dashdiag
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Push the regenerated Homebrew formula to keyorixhq/homebrew-tap.
  # Off by default — a no-op until the maintainer has:
  #   1. created the keyorixhq/homebrew-tap repo,
  #   2. added a HOMEBREW_TAP_TOKEN secret (PAT with contents:write on the tap),
  #   3. set the HOMEBREW_TAP_ENABLED repo variable to 'true'.
  # Guarded so it never blocks or fails a release while disabled.
  update-tap:
    needs: release
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate formula for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/gen-homebrew-formula.sh
          scripts/gen-homebrew-formula.sh "$VERSION"

      - name: Push formula to tap repo
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/keyorixhq/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew-tap/Formula/dsd.rb tap/Formula/dsd.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dsd.rb
          git commit -m "dsd ${VERSION}" || { echo "no change"; exit 0; }
          git push
