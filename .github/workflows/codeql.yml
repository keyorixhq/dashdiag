name: CodeQL

# First-party SAST (SSDLC Layer 1, ADR-0007). gosec (via golangci-lint) and our
# semgrep rules catch known patterns on every PR; CodeQL adds GitHub's deeper
# dataflow analysis for the security bug classes those miss, with results in the
# Security tab. Runs on push to main, on every PR, and weekly.
# Note: pull_request is required for OpenSSF Scorecard's SAST check (alert #30)
# to count commits as "checked with a SAST tool".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 9 * * 1' # weekly, offset from the other security jobs

permissions:
  contents: read

# Cancel superseded runs on the same ref (matches ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-aware skip gate — same mechanism and allowlist as ci.yml's `changes`
  # job (keep the allowlist in sync there; not a required branch-protection
  # check today, but gated for consistency and runner-time savings). Only
  # gates pull_request events; push/schedule always run the full analysis —
  # the schedule trigger exists specifically to catch a newly published CodeQL
  # query on unchanged code, so it must never be skipped.
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # to list the PR's changed files
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^(README\.md|CONTRIBUTING\.md|CHANGELOG\.md|COMPATIBILITY\.md|GETTING_STARTED\.md|PRIVACY\.md|SECURITY\.md|BACKLOG\.md|BUGS\.md|LICENSE|DCO|docs/)' > /dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (go)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      # Autobuild only compiles the main binary, leaving all _test.go files
      # invisible to CodeQL (the bulk of the codebase by file count). Build
      # explicitly: production packages first, then compile every test package
      # without running tests so CodeQL sees the full surface.
      - name: Build
        run: go build ./...

      - name: Compile tests
        run: go test -run ^$ ./...

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
