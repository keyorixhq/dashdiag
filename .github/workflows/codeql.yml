name: CodeQL

# First-party SAST (SSDLC Layer 1, ADR-0007). gosec (via golangci-lint) and our
# semgrep rules catch known patterns on every PR; CodeQL adds GitHub's deeper
# dataflow analysis for the security bug classes those miss, with results in the
# Security tab. Runs on push to main, on every PR, and weekly.
# Note: pull_request is required for OpenSSF Scorecard's SAST check (alert #30)
# to count commits as "checked with a SAST tool".

on:
  push:
    branches: [main]
  # paths-ignore is applied ONLY to pull_request, deliberately. The `changes`
  # job it replaces emitted docs_only=false for every non-PR event, so push
  # and schedule ran the analysis unconditionally; putting paths-ignore on
  # push too would silently change that. This is a job-count change, not a
  # coverage change.
  #
  # Safe here and NOT safe in ci.yml or security.yml: a workflow that
  # paths-ignore skips never creates its check-runs at all, and branch
  # protection waits forever on a REQUIRED check that was never created.
  # Nothing this workflow produces is required (verified against branch
  # protection: 18 required contexts, none of them from here), so skipping
  # the whole workflow is equivalent to skipping its jobs. ci.yml and
  # security.yml both carry required checks and keep their `changes` jobs
  # for exactly that reason.
  pull_request:
    branches: [main]
    paths-ignore:
      # Exactly the allowlist the deleted `changes` job matched on. paths-ignore
      # means "run unless EVERY changed file matches", which is the same
      # predicate docs_only computed, one layer earlier and without a job.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'COMPATIBILITY.md'
      - 'GETTING_STARTED.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'BACKLOG.md'
      - 'BUGS.md'
      - 'LICENSE'
      - 'DCO'
      - 'docs/**'
  schedule:
    - cron: '41 9 * * 1' # weekly, offset from the other security jobs

permissions:
  contents: read

# Cancel superseded runs on the same ref (matches ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-aware skip gate — same mechanism and allowlist as ci.yml's `changes`
  # job (keep the allowlist in sync there; not a required branch-protection
  # check today, but gated for consistency and runner-time savings). Only
  # gates pull_request events; push/schedule always run the full analysis —
  # the schedule trigger exists specifically to catch a newly published CodeQL
  # query on unchanged code, so it must never be skipped.
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      # Autobuild only compiles the main binary, leaving all _test.go files
      # invisible to CodeQL (the bulk of the codebase by file count). Build
      # explicitly: production packages first, then compile every test package
      # without running tests so CodeQL sees the full surface.
      - name: Build
        run: go build ./...

      - name: Compile tests
        run: go test -run ^$ ./...

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
