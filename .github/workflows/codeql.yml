name: CodeQL

# First-party SAST (SSDLC Layer 1, ADR-0007). gosec (via golangci-lint) and our
# semgrep rules catch known patterns on every PR; CodeQL adds GitHub's deeper
# dataflow analysis for the security bug classes those miss, with results in the
# Security tab. Runs on push to main, on every PR, and weekly.
# Note: pull_request is required for OpenSSF Scorecard's SAST check (alert #30)
# to count commits as "checked with a SAST tool".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 9 * * 1' # weekly, offset from the other security jobs

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4

      - name: Analyze
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
